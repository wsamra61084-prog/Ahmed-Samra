<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>سكون Workspace – إدارة صالات الألعاب</title><meta name="theme-color" content="#0d1226">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#0a0e1a;--cd:#121a2e;--c2:#1a2440;--bd:#27324f;--tx:#e8ecf6;--mu:#8b97b5;--ac:#8468ff;--a2:#22d3ee;--ok:#22c55e;--wr:#f59e0b;--er:#ef4444;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{display:flex;min-height:100vh}.sb{width:224px;background:var(--cd);border-inline-end:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.lg{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center;padding:6px 8px 16px}.lg i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--a2));display:grid;place-items:center;color:#fff;font-style:normal}
.nv{border:0;background:none;color:var(--mu);text-align:start;padding:10px 12px;border-radius:10px;font:600 14px Cairo,Tahoma;cursor:pointer}.nv.on,.nv:hover{background:var(--c2);color:var(--tx)}.nv.on{box-shadow:inset 3px 0 0 var(--ac)}
.mn{flex:1;padding:22px;min-width:0}h2{margin:0 0 16px;font-size:22px}h3{margin:0 0 10px}

.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}.kp b{display:block;font-size:22px;margin-top:4px}.kp span,.mu{color:var(--mu);font-size:12px}

.b{border:0;border-radius:10px;padding:8px 13px;background:var(--c2);color:var(--tx);font:600 13px Cairo,Tahoma;cursor:pointer}.b:hover{filter:brightness(1.12)}.p{background:var(--ac);color:#fff}.s{background:var(--ok);color:#fff}.d{background:var(--er);color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font:14px Cairo,Tahoma;margin:4px 0 10px}
label{font-size:12px;color:var(--mu)}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
.pg{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.pi{background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;font:600 14px Cairo;color:var(--tx)}.pi:hover{border-color:var(--ac)}.pi small{display:block;color:var(--a2);margin-top:4px}
.pos{grid-template-columns:1fr 340px}.bar{height:8px;background:var(--c2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--a2))}
#mo{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:14px}#mo.on{display:flex}.md{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}.bt{display:flex;gap:8px;justify-content:flex-start;margin-top:8px}
.lgn{max-width:360px;margin:12vh auto}

body{-webkit-font-smoothing:antialiased}
.sb{background:linear-gradient(180deg,#141a33,#0d1226);border:0;box-shadow:2px 0 24px #0003}.sb .mu{color:#8e98bd}
.nv{color:#aab3d4;display:flex;align-items:center;transition:.15s}.nv:hover{background:#ffffff14;color:#fff}.nv.on{background:linear-gradient(270deg,#6d4aff40,#6d4aff10);color:#fff;box-shadow:inset -3px 0 0 var(--ac)}

.cd{border-radius:16px;box-shadow:0 1px 2px #0f172a0d,0 10px 28px -14px #0f172a33}h2{font-weight:800;letter-spacing:-.2px}
.kp{position:relative;overflow:hidden}.kp::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--ac),var(--a2))}.kp b{font-size:26px}
th{background:var(--c2);font-weight:700}th:first-child{border-radius:0 10px 10px 0}th:last-child{border-radius:10px 0 0 10px}tr:hover td{background:#6d4aff0d}
.b{transition:transform .1s,filter .15s}.b:active{transform:scale(.97)}.p{background:linear-gradient(135deg,var(--ac),#5b3df0);box-shadow:0 6px 14px -6px var(--ac)}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #6d4aff2e}
#mo{backdrop-filter:blur(6px);background:#0a0e1a99}.md{animation:pp .18s ease;box-shadow:0 30px 80px -20px #000a;border-radius:18px}@keyframes pp{from{opacity:0;transform:translateY(10px) scale(.98)}}
.tmr{font-size:34px;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--ac),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dv .cd{border-top:3px solid var(--ac)}.pi{transition:.15s}.pi:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px var(--ac)}
.lgw{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}.lgh{background:radial-gradient(circle at 20% 15%,#6d4aff59,transparent 55%),linear-gradient(160deg,#141a33,#0a0e1a);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.lgh h1{font-size:34px;line-height:1.4;margin:22px 0 0;max-width:430px}.lgh p{color:#aab3d4;max-width:430px;margin:0}.lgh ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px;color:#dfe4f6}.lgh li::before{content:"\2713";color:var(--a2);margin-inline-end:10px;font-weight:800}
.lgf{display:flex;flex-direction:column;justify-content:center;padding:48px;max-width:460px;width:100%;margin:auto}
@media(max-width:820px){.lgw{grid-template-columns:1fr}.lgh{padding:28px}.lgf{padding:28px}.nv svg{display:none}}
</style></head><body><div id="r"></div><div id="mo"></div>
<script>
const K='gl_v1',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>Math.random().toString(36).slice(2,9);
const ALL={dev:'الجلسات',sub:'الاشتراكات',pos:'الكافيه',stock:'المخزن والمشتريات',cash:'الخزنة',rep:'التقارير',usr:'المستخدمين'};
const def=()=>({devs:[['PS5 - 1',40],['PS5 - 2',40],['PS4 - 1',30],['PS4 - 2',30],['PC - 1',25],['VIP',60]].map(([name,rate],i)=>({id:'d'+i,name,rate,s:null})),
inv:[['بن','جم',2000,300],['شاي','جم',1000,200],['سكر','جم',3000,500],['بيبسي','زجاجة',48,12],['مياه','زجاجة',48,12],['مشروب طاقة','علبة',24,6],['شيبسي','كيس',30,8]].map(([name,u,qty,min],i)=>({id:'i'+i,name,u,qty,min})),
prods:[['قهوة',20,[['i0',10],['i2',8]]],['شاي',12,[['i1',3],['i2',8]]],['بيبسي',15,[['i3',1]]],['مياه',6,[['i4',1]]],['مشروب طاقة',35,[['i5',1]]],['شيبسي',10,[['i6',1]]]].map(([name,price,r],i)=>({id:'p'+i,name,price,r:r.map(([i,q])=>({i,q}))})),
sess:[],sales:[],buys:[],cash:[],cancels:[],users:[{id:'u1',name:'المدير',user:'admin',pass:'1234',perms:Object.keys(ALL)}]});
let S,U,V='dev',cart=[],RG='today';try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||def();
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mon=n=>(Math.round(n*100)/100).toLocaleString('ar-EG')+' ج.م',num=n=>(Math.round(n*10)/10).toLocaleString('ar-EG');
const hms=ms=>{const s=Math.floor(ms/1000);return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const dt=t=>new Date(t).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),tm=t=>new Date(t).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
const cost=(d,ms)=>Math.ceil(ms/60000*d.rate/60),isum=a=>a.reduce((s,i)=>s+i.price*i.qty,0);
const t0=()=>new Date().setHours(0,0,0,0),from=()=>RG=='today'?t0():RG=='week'?t0()-6*864e5:0,inR=t=>t>=from();
const can=p=>U&&U.perms.includes(p),P=id=>S.prods.find(p=>p.id==id),I=id=>S.inv.find(i=>i.id==id),D=id=>S.devs.find(d=>d.id==id);
function use(p,q){p.r.forEach(r=>{const x=I(r.i);if(x)x.qty-=r.q*q})}
function T(h,rows){return`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length} class=mu>لا توجد بيانات</td></tr>`}</table></div>`}
function M(title,body,btns){const m=$('#mo');m.innerHTML=`<div class=md><h3>${title}</h3><div>${body}</div><div class=bt>${btns.map((b,i)=>`<button class="b ${b.c||''}" data-i=${i}>${b.t}</button>`).join('')}</div></div>`;m.classList.add('on');m.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{const f=btns[e.dataset.i].f;if(!f||f()!==false)X()})}
const X=()=>{$('#mo').classList.remove('on');draw()},v=id=>$('#'+id).value,F=(id,l,t='text',x='')=>`<label>${l}</label><input id=${id} type=${t} ${x}>`,SEL=(id,l,o)=>`<label>${l}</label><select id=${id}>${o.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</select>`;
const ent=(kind,t,amt,note)=>0;
/* ---------- views ---------- */
function vDev(){const run=S.devs.filter(d=>d.s).length,tr=revenue(t0()),low=S.inv.filter(i=>i.qty<=i.min).length;
return`<h2>لوحة الأجهزة</h2><div class="g k"><div class="cd kp"><span>أجهزة شغالة</span><b>${run} / ${S.devs.length}</b></div><div class="cd kp"><span>إيراد اليوم</span><b>${mon(tr)}</b></div><div class="cd kp"><span>أصناف تحت الحد الأدنى</span><b style="color:${low?'var(--er)':'inherit'}">${low}</b></div></div>
<div class="g dv">${S.devs.map(d=>`<div class=cd><div class="row sp"><b>${esc(d.name)}</b><span class="tg ${d.s?'bs':'fr'}">${d.s?'مشغول':'متاح'}</span></div><div class=mu>${mon(d.rate)} / ساعة</div>
${d.s?`<div class=tmr data-t=${d.id}>${hms(Date.now()-d.s.start)}</div><div class="row sp mu"><span>${esc(d.s.cust)} • ${tm(d.s.start)}</span><b style="color:var(--tx)" data-c=${d.id}></b></div><div class=row style="margin-top:12px"><button class="b" data-a=im data-p=${d.id}>مشروبات</button><button class="b s" data-a=end data-p=${d.id}>إنهاء</button><button class="b d" data-a=cs data-p=${d.id}>إلغاء</button></div>`:`<div class=tmr style="color:var(--mu)">00:00:00</div><button class="b p" style="width:100%" data-a=st data-p=${d.id}>بدء جلسة</button>`}</div>`).join('')}</div>`}
function vPos(){const tot=isum(cart),run=S.live;
return`<div class="row sp"><h2>الكافيه</h2><span class=row><button class=b data-a=np>+ صنف جديد</button><button class="b ${EM?'p':''}" data-a=tgm>${EM?'إنهاء وضع التعديل':'وضع تعديل الأصناف'}</button></span></div>${EM?'<p class=mu>اضغط على أي صنف لتعديله</p>':''}<div class="g pos"><div class="g pg" style="align-content:start">${S.prods.map(p=>`<button class=pi data-a=ap data-p=${p.id}>${esc(p.name)}<small>${mon(p.price)}</small></button>`).join('')}</div>
<div class=cd><h3>الطلب الحالي</h3>${cart.map((c,i)=>`<div class="row sp" style="margin-bottom:8px"><span>${esc(c.name)}</span><span class=row><button class=b data-a=cq data-p="${i}|-1">−</button><b>${c.qty}</b><button class=b data-a=cq data-p="${i}|1">+</button></span><b>${mon(c.price*c.qty)}</b></div>`).join('')||'<p class=mu>اختر أصناف من القائمة</p>'}
<hr style="border:0;border-top:1px solid var(--bd)"><div class="row sp"><b>الإجمالي</b><b style="font-size:20px">${mon(tot)}</b></div>
<label>الدفع</label><select id=tgt><option value="">بيع مباشر (كاش)</option>${run.map(d=>`<option value=${d.id}>ترحيل على ${esc(d.cust)} – ${esc(d.room)}</option>`).join('')}</select>
<div class=row><button class="b s" style="flex:1" data-a=pay>تأكيد</button><button class="b d" data-a=clr>مسح</button></div></div></div>`}
function vStock(){return`<h2>المخزن والمشتريات</h2><div class="row" style="margin-bottom:12px"><button class="b p" data-a=ni>+ خامة جديدة</button><button class="b s" data-a=buy>+ فاتورة شراء</button><button class="b" data-a=np>+ صنف كافيه</button></div>
<div class=cd style="margin-bottom:14px"><h3>جرد الخامات</h3>${T(['الخامة','الرصيد','الحد الأدنى','الحالة',''],S.inv.map(i=>[esc(i.name),num(i.qty)+' '+esc(i.u),num(i.min),`<span class="tg ${i.qty<=i.min?'lw':'fr'}">${i.qty<=i.min?'يحتاج شراء':'متوفر'}</span>`,`<button class=b data-a=einv data-p=${i.id}>تعديل</button> <button class="b d" data-a=dinv data-p=${i.id}>حذف</button>`]))}</div>
<div class=cd style="margin-bottom:14px"><h3>أصناف الكافيه والوصفات</h3>${T(['الصنف','السعر','الخامات المستهلكة / وحدة',''],S.prods.map(p=>[esc(p.name),mon(p.price),p.r.map(r=>`${esc(I(r.i)?.name||'؟')} ${r.q}`).join('، ')||'—',`<button class=b data-a=ep data-p=${p.id}>تعديل</button> <button class="b d" data-a=dp data-p=${p.id}>حذف</button>`]))}</div>
<div class=cd><h3>سجل المشتريات</h3>${T(['التاريخ','الخامة','الكمية','التكلفة','المورد',''],S.buys.map((b,x)=>[dt(b.t),esc(b.n),num(b.q),mon(b.c),esc(b.sup||'—'),`<button class=b data-a=eb data-p=${x}>تعديل</button> <button class="b d" data-a=db data-p=${x}>حذف</button>`]).reverse())}</div>`}
function ledger(){const L=[];S.sess.filter(s=>s.st=='done').forEach(s=>L.push({t:s.end,n:`جلسة ${s.dn} – ${s.cust}`,a:s.paid??s.total}));S.sales.forEach(s=>L.push({t:s.t,n:'بيع كافيه',a:s.total}));S.buys.forEach(b=>L.push({t:b.t,n:'شراء: '+b.n,a:-b.c}));S.cash.forEach(c=>{c.id=c.id||uid();L.push({t:c.t,n:c.n,a:c.a,id:c.id})});return L.sort((a,b)=>b.t-a.t)}
function vCash(){const L=ledger(),a=L.reduce((s,x)=>s+x.a,0),inn=L.filter(x=>x.a>0&&inR(x.t)).reduce((s,x)=>s+x.a,0),out=L.filter(x=>x.a<0&&inR(x.t)).reduce((s,x)=>s-x.a,0);
return`<h2>الخزنة</h2><div class="g k"><div class="cd kp"><span>رصيد الخزنة</span><b>${mon(a)}</b></div><div class="cd kp"><span>وارد اليوم</span><b style="color:var(--ok)">${mon(L.filter(x=>x.a>0&&x.t>=t0()).reduce((s,x)=>s+x.a,0))}</b></div><div class="cd kp"><span>منصرف اليوم</span><b style="color:var(--er)">${mon(L.filter(x=>x.a<0&&x.t>=t0()).reduce((s,x)=>s-x.a,0))}</b></div></div>
<div class=row style="margin-bottom:12px"><button class="b s" data-a=ci data-p=1>+ إيداع</button><button class="b d" data-a=ci data-p=-1>− مصروف / سحب</button></div><div class=cd>${T(['التاريخ','البيان','المبلغ',''],L.slice(0,150).map(x=>[dt(x.t),esc(x.n),`<b style="color:${x.a<0?'var(--er)':'var(--ok)'}">${mon(x.a)}</b>`,x.id?`<button class=b data-a=ecs data-p=${x.id}>تعديل</button> <button class="b d" data-a=dcs data-p=${x.id}>حذف</button>`:'']))}</div>`}
function revenue(f){return S.sess.filter(s=>s.st=='done'&&s.end>=f).reduce((s,x)=>s+x.total,0)+S.sales.filter(s=>s.t>=f).reduce((s,x)=>s+x.total,0)}
function vRep(){const f=from(),ss=S.sess.filter(s=>s.end>=f),dn=ss.filter(s=>s.st=='done'),sl=S.sales.filter(s=>s.t>=f),cn=S.cancels.filter(c=>c.t>=f);
const tc=dn.reduce((s,x)=>s+x.tc,0),ic=dn.reduce((s,x)=>s+x.ic,0)+sl.reduce((s,x)=>s+x.total,0);
const pr={};[...dn.flatMap(s=>s.items),...sl.flatMap(s=>s.items)].forEach(i=>{const o=pr[i.name]||(pr[i.name]={q:0,a:0});o.q+=i.qty;o.a+=i.qty*i.price});
const cu={};dn.forEach(s=>{const o=cu[s.cust]||(cu[s.cust]={n:0,m:0,a:0});o.n++;o.m+=s.mins;o.a+=s.total});
const dm={};dn.forEach(s=>dm[s.dn]=(dm[s.dn]||0)+s.mins);const days=RG=='today'?1:RG=='week'?7:Math.max(1,Math.ceil((Date.now()-Math.min(Date.now(),...S.sess.map(s=>s.start)))/864e5)),cap=days*12*60;
